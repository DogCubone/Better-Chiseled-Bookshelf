plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven {
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            name = "Modrinth"
            url "https://api.modrinth.com/maven"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings "net.fabricmc:yarn:$rootProject.yarn_mappings:v2"

        modImplementation "maven.modrinth:jade:$rootProject.jade_version"
        modImplementation "maven.modrinth:midnightlib:${project.midnightlib_version}-fabric"
        modImplementation "maven.modrinth:jade:${project.jade_version}+fabric"
        modImplementation "maven.modrinth:easy-magic:${project.easy_magic_version}-Fabric"
        modImplementation "maven.modrinth:enchanting-infuser:${project.enchantment_infuser}-Fabric"

        //WHY DOES THE MODRINTH ONE GIVE ME AN ERROR? WHY
        // modLocalRuntime "maven.modrinth:puzzles-lib:v8.1.32-1.20.1-Fabric"
        // modLocalRuntime "maven.modrinth:forge-config-api-port:v8.0.3-1.20.1-Fabric"

        modLocalRuntime "curse.maven:puzzles-lib-495476:5904751"
        modLocalRuntime "curse.maven:forge-config-api-port-fabric-547434:5902421"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
